# LIBERO-10 suite (10 tasks × 5 episodes) — replan_step=15
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    subname: libero_10
    mode: sync
    episodes_per_task: 5
    params:
      suite: libero_10
      seed: 7
      num_steps_wait: 10
